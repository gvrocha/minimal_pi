# Milestone 2 — WiFi AP mode for the Pi 3B+'s onboard wlan0
# (brcmfmac / brcmfmac43455-sdio). Local SSH access only: no internet
# uplink, no NAT, no packet forwarding. See STATUS.md / lessons-learned.md.
#
# ssid and wpa_passphrase below are placeholders — edit before flashing.
# wpa_passphrase must be 8-63 characters (WPA-PSK requirement).
interface=wlan0
driver=nl80211
ssid=minpi-ap
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_passphrase=CHANGE_ME_8_TO_63_CHARS
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
