# Milestone 2 — DHCP for the Pi's WiFi AP (wlan0). Local SSH access only:
# no internet uplink, so deliberately no dhcp-option=3 (router) or
# dhcp-option=6 (DNS) — a client just needs an address to reach the Pi
# directly by IP over SSH.
#
# wlan0 itself must be statically addressed 192.168.4.1/24 (outside this
# DHCP pool) before dnsmasq starts — see build-apkovl.sh's wlan0 stanza
# in /etc/network/interfaces (milestone-2 step 2, not yet wired up).
interface=wlan0
bind-interfaces
dhcp-range=192.168.4.10,192.168.4.100,12h
